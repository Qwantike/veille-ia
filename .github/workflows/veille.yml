name: veille

on:
  schedule:
    - cron: "0 6 * * *"   # 6 h UTC = 7 h en hiver, 8 h en été (heure de Paris)
  workflow_dispatch:       # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python veille.py
      - name: Publier la page du jour
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add docs state
          git diff --cached --quiet && exit 0
          git commit -m "veille $(date +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1