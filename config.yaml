    min_keyword_score: 6

  # ---- Communauté (Hacker News, filtré par nombre de points)
  - name: Hacker News (LLM)
    url: https://hnrss.org/newest?q=LLM&points=150
    category: communaute
    weight: 3
  - name: Hacker News (agents)
    url: https://hnrss.org/newest?q=AI%20agents&points=100
    category: communaute
    weight: 3
